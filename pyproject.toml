[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "termimock"
version = "0.1.0"
description = "A terminal TUI for defining REST mock endpoints while serving them locally."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Termimock Contributors" }
]
keywords = ["mock-server", "tui", "rest", "api", "frontend"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/homiyano/termimock"
Repository = "https://github.com/homiyano/termimock"
Issues = "https://github.com/homiyano/termimock/issues"
Releases = "https://github.com/homiyano/termimock/releases"

[project.scripts]
termimock = "termimock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
